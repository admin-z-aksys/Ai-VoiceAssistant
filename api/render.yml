services:
  - type: web
    name: ai-voiceassistant          # can match or differ from the current service name
    env: python
    plan: standard                   # matches your current plan (1 CPU, 2 GB)
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: PORT=8000 uvicorn app:app --host 0.0.0.0 --port $PORT
    packages:
      - espeak-ng                    # <— system package you need
